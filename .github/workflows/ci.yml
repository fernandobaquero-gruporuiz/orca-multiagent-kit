name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: bash 3.2 y herramientas BSD, como en el portátil de quien lo instala
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobaciones estáticas
        run: bash scripts/check.sh
      - name: Pruebas del instalador
        run: bash tests/test_install.sh
      - name: Pruebas del CLI (npm pack + omk)
        run: bash tests/test_cli.sh
      - name: Pruebas de omk team (ORCHESTRATION.md)
        run: bash tests/test_team.sh
      - name: Pruebas de omk setup y omk plugin (doble de Orca)
        run: bash tests/test_orca.sh
      - name: Pruebas de omk update (proyecto, plantilla y plugin)
        run: bash tests/test_update.sh
      - name: Pruebas de la puerta de reparto (hook de Claude Code)
        run: bash tests/test_gate.sh
      - name: Pruebas de omk run (motor de los runs)
        run: bash tests/test_run.sh
      - name: Pruebas de omk run plan, git y cleanup
        run: bash tests/test_run_plan.sh && bash tests/test_run_git.sh && bash tests/test_run_cleanup.sh
      - name: Empaquetado
        run: bash scripts/build-release.sh

  exe:
    name: Ejecutable autónomo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # El ejecutable lleva dentro este Node: una LTS con soporte largo
          node-version: 22
      - name: Construir
        run: node scripts/build-exe.js
      - name: Probar el ejecutable
        run: bash tests/test_exe.sh
      - name: Pruebas de omk setup y omk plugin (doble de Orca)
        run: bash tests/test_orca.sh

  speckit:
    name: Extensión spec-kit (CLI real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar spec-kit
        run: pip install "git+https://github.com/github/spec-kit.git"
      - name: Probar la extensión orca
        run: bash tests/test_speckit.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning install.sh scripts/*.sh tests/*.sh
